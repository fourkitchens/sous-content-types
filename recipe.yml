name: 'Sous Content Types'
description: 'A recipe that contains modules and configuration for Sous content.'
type: 'Site'
recipes:
  - sous-formats
  - sous-media
install:
  # Install core dependencies.
  - media
  - media_library
  - node
  - text
  - user
  # Install the modules used by Page fields, widgets, and settings.
  - field_group
  - metatag
  - publication_date
  - scheduler
  - tagify
config:
  import:
    metatag: '*'
